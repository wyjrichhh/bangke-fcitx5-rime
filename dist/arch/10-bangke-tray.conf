# Omarchy 的 omarchy-fcitx5.service 默认写着
#
#     ExecStart=/usr/bin/fcitx5 --disable notificationitem
#
# 它注释里的理由是「会和栏自己画的输入法指示器重复」。这份 drop-in 把那面旗去掉，
# 托盘里才有 fcitx5 的状态图标 —— 那个图标的右键菜单里挂着「蚌壳拼音 设置 / 部署 / 同步」。
#
# 覆盖 ExecStart 必须先清空再赋值（systemd 的规定，少了一行就是追加而不是替换）。
# 代价是栏上会同时有 Omarchy 自己的指示器和我们的图标。**不想这样的话**：
#     sudo rm /etc/systemd/user/omarchy-fcitx5.service.d/10-bangke-tray.conf
#     systemctl --user daemon-reload
#     systemctl --user restart omarchy-fcitx5
[Service]
ExecStart=
ExecStart=/usr/bin/fcitx5
